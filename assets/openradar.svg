<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="face" cx="64" cy="58" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d2b3a"/>
      <stop offset="1" stop-color="#0b1016"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5a6c"/>
      <stop offset="1" stop-color="#232c37"/>
    </linearGradient>
    <linearGradient id="sweep" x1="64" y1="64" x2="18" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3fa9f5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3fa9f5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff4d4f" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff4d4f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen">
      <circle cx="64" cy="62" r="48"/>
    </clipPath>
  </defs>

  <!-- Base with a darker lip underneath for depth -->
  <circle cx="64" cy="66" r="56" fill="#141a21"/>
  <circle cx="64" cy="62" r="56" fill="url(#rim)"/>
  <circle cx="64" cy="62" r="48" fill="url(#face)"/>

  <g clip-path="url(#screen)">
    <!-- Grid -->
    <g fill="none" stroke="#3fa9f5" stroke-opacity="0.22" stroke-width="1.5">
      <circle cx="64" cy="62" r="16"/>
      <circle cx="64" cy="62" r="32"/>
      <path d="M64 14V110M16 62H112"/>
    </g>
    <!-- Sweep: a fading wedge trailing the bright leading edge -->
    <path d="M64 62L64 14A48 48 0 0 0 22.4 38Z" fill="url(#sweep)"/>
    <path d="M64 62L64 14" stroke="#7cc8ff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Blips -->
    <circle cx="88" cy="44" r="5" fill="#3ddc84"/>
    <circle cx="44" cy="86" r="4.5" fill="#ffd54a"/>
    <circle cx="84" cy="88" r="4" fill="#3fa9f5"/>
    <circle cx="46" cy="34" r="12" fill="url(#glow)"/>
    <circle cx="46" cy="34" r="5.5" fill="#ff4d4f"/>
  </g>

  <!-- You -->
  <circle cx="64" cy="62" r="5" fill="#ffffff"/>
  <circle cx="64" cy="62" r="5" fill="none" stroke="#0b1016" stroke-width="1.5"/>

  <!-- Rim highlight -->
  <circle cx="64" cy="62" r="55" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="64" cy="62" r="48.5" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="1"/>
</svg>
